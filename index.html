<style>
:root{box-sizing:border-box;color-scheme:dark;--bg:#140a24;--bg2:#2a1245;--ink:#f6eefc;--mute:#b9a6d3;--gold:#f6c945;--gold2:#b8841a;--card:#22103a;--line:#4a2d72;--pink:#ff6fa5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(ellipse at 50% 0%,var(--bg2),var(--bg) 70%);background-color:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
#app{height:100dvh;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 6px) 12px calc(env(safe-area-inset-bottom,0px) + 8px)}
header{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;flex:none}
h1{font-size:clamp(20px,6vw,28px);margin:0;color:var(--gold);letter-spacing:.1em;text-shadow:0 0 14px rgba(246,201,69,.55)}
.ctl{display:flex;gap:6px}
.ctl button{width:38px;height:38px;padding:0;font-size:18px;border-radius:50%}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 10px;touch-action:manipulation}
button:active{transform:scale(.96)}
button.go{background:linear-gradient(135deg,var(--gold),#e59a1c);color:#2a1700;border-color:transparent;font-weight:700}
.mirror{flex:1 1 0;min-height:0;aspect-ratio:3/4;max-width:90vw;margin:6px 0;border-radius:50%/42%;padding:11px;background:linear-gradient(135deg,#ffe58a,var(--gold2) 40%,#ffe58a 60%,var(--gold2));box-shadow:0 0 36px rgba(246,201,69,.35),inset 0 0 12px #5a3a00}
.glass{position:relative;width:100%;height:100%;border-radius:50%/42%;overflow:hidden;background:#120a22;box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.glass::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 35% 25%,#7a5fb8,#2d1b57 55%,#150a2e);transition:opacity .9s}
.q::before{opacity:.28}.gen::before{animation:pu 2.2s ease-in-out infinite}
@keyframes pu{0%,100%{opacity:.12}50%{opacity:1}}
.glass::after{content:"";position:absolute;inset:-30% -60%;background:linear-gradient(100deg,transparent 42%,rgba(255,255,255,.2) 50%,transparent 58%);animation:sw 5s linear infinite;pointer-events:none}
@keyframes sw{from{transform:translateX(-60%)}to{transform:translateX(60%)}}
.glass>svg,#portrait{position:absolute;inset:0;width:100%;height:100%}
#ghost{transition:opacity .9s}.has #ghost,.q #ghost,.gen #ghost{opacity:.1}
.talk .mouth{animation:yap .25s infinite alternate}
.mouth{transform-box:fill-box;transform-origin:center}
@keyframes yap{from{transform:scaleY(.4)}to{transform:scaleY(1.7)}}
#spiral{opacity:0;pointer-events:none;z-index:2}#spiral g{transform-origin:100px 100px}
#spiral.on{animation:sp 2.4s ease-in-out infinite}#spiral.on g{animation:spin 3.2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sp{0%,100%{opacity:.05}50%{opacity:.95}}
#portrait.em{animation:em 1.8s ease-out}
.pin{width:100%;height:100%;transform-origin:50% 85%}.pin svg{display:block;width:100%;height:100%}
.a-tilt{animation:atilt 1.3s ease-in-out infinite}@keyframes atilt{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.a-bounce{animation:abo .6s ease-in-out infinite alternate}@keyframes abo{to{transform:translateY(-12px) scale(1.03)}}
.a-shake{animation:ash .18s linear infinite alternate}@keyframes ash{from{transform:translateX(-4px) rotate(-2deg)}to{transform:translateX(4px) rotate(2deg)}}
.a-hop{animation:aho .9s ease-out infinite}@keyframes aho{0%,100%{transform:none}40%{transform:translateY(-18px) scale(1.06)}}
.a-sway{animation:asw 1.6s ease-in-out infinite}@keyframes asw{0%,100%{transform:translateX(-8px) rotate(-3deg)}50%{transform:translateX(8px) rotate(3deg)}}
.a-lean{animation:ale 2s ease-in-out infinite}@keyframes ale{0%,100%{transform:none}50%{transform:scale(1.1) translateY(4px)}}
@keyframes em{0%{opacity:0;transform:rotate(-540deg) scale(.05);filter:blur(10px)}60%{opacity:.8}100%{opacity:1;transform:none;filter:none}}
#say{position:absolute;left:12%;right:12%;text-align:center;font-size:clamp(15px,4.4vw,21px);line-height:1.55;color:#fff6c2;text-shadow:0 0 12px #f6c945,0 0 3px #000;z-index:3;opacity:0}

#say.b{bottom:7%;background:rgba(20,10,36,.62);border-radius:14px;padding:6px 8px;font-size:clamp(13px,3.6vw,16px)}
#say.in{animation:fl 1.1s ease-out forwards}
@keyframes fl{0%{opacity:0;filter:blur(8px);margin-top:34px}100%{opacity:1;filter:none;margin-top:0}}
#prog{position:absolute;top:7%;width:100%;text-align:center;color:var(--gold);font-size:12px;letter-spacing:.2em;z-index:3}
#dock{flex:none;width:100%;max-width:520px;min-height:clamp(150px,25dvh,200px);overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:8px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;animation:fi .6s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.grid button{font-size:14px;padding:9px 4px}
.row{display:flex;gap:8px}.row>*{flex:1}
input{flex:1;min-width:0;font:inherit;font-size:16px;background:#150a2a;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{font-size:12.5px;padding:5px 10px;border-radius:999px}
.res{font-size:12px;line-height:1.4;color:var(--mute)}.nm{font-size:16px;font-weight:700;color:var(--gold);line-height:1.3}.nm span{font-size:12px;color:var(--pink);font-weight:400}.row.sm{justify-content:center;gap:6px}.row.sm>*{flex:0 1 auto;font-size:12px;padding:5px 12px;border-radius:10px}.res b{color:var(--pink)}
#start{position:fixed;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(20,10,36,.94);text-align:center;color:var(--gold);font-size:20px;letter-spacing:.15em}
#start small{color:var(--mute);font-size:13px;letter-spacing:0;padding:0 24px}
.hide{display:none!important}
.a-tilt{animation-duration:2.6s}.a-sway{animation-duration:3s}.a-lean{animation-duration:3.2s}
#start{justify-content:flex-end;gap:0;background:radial-gradient(ellipse at 50% 30%,#2a1245,#140a24 75%);padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 9vh)}.scene{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}.scene .nomatch{height:100%;max-width:92vw}.ttl{padding-top:10px}.scene .nomatch{-webkit-mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent),linear-gradient(to bottom,#000 86%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 7%,#000 93%,transparent),linear-gradient(to bottom,#000 86%,transparent);mask-composite:intersect}@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}.tw{animation:tw 2.4s ease-in-out infinite}

.scene{position:relative}.comp{position:absolute;left:0;bottom:22%;width:100%;aspect-ratio:1900/1960}

.qq{position:absolute;left:33.7%;top:39.8%;width:66.3%;height:auto;overflow:visible}

.scene{-webkit-mask-image:linear-gradient(to bottom,#000 80%,transparent 99%);mask-image:linear-gradient(to bottom,#000 80%,transparent 99%)}
.t1,.t2{position:absolute;z-index:30;display:flex;align-items:center;justify-content:center;font-size:clamp(53.1px,18.1vw,91.9px);white-space:nowrap;font-weight:800;letter-spacing:.06em;line-height:1;background:linear-gradient(180deg,#fff6c2,#f6c945 55%,#d9a21e);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px rgba(246,201,69,.75));pointer-events:none;animation:tfl 3.4s ease-in-out infinite}

.t2{left:49%;top:22%;width:50%;height:19%;transform:rotate(5deg);animation-delay:-1.7s}

'晚餐吃什麼？':['聽我的，來碗熱騰騰的牛肉麵，再加顆滷蛋。吃飽才有力氣談戀愛！','鹹酥雞配珍奶，罪惡但是快樂，明天再減肥。','火鍋！一個人也要吃得熱鬧，記得多加一盤肉。','滷肉飯加燙青菜，樸實無華，但最安心。','想吃什麼就吃什麼，反正我沒有嘴，只能看你吃，哈哈哈！','來份炒飯吧，簡單、快速、不會出錯，像我的預言。','夜市走一圈，看到哪攤排隊就吃哪攤。','水餃二十顆，不要問，我看見你會吃完。','今天值得吃好一點，去吃壽司吧，犒賞自己！','泡麵加蛋加起司，深夜靈魂食物，我不會告訴別人。']};
const KW=[[/愛|喜歡|交往|告白|戀|對象|男朋友|女朋友|桃花|結婚|脫單/,['愛情這件事，鏡子最懂：先愛自己，再愛上那個會在你身邊傻笑的人。','別急，緣分是個調皮的小傢伙，你一轉身它就來了，哈哈哈！','想告白就告白，被拒絕了就來找我，我陪你罵他沒眼光。','桃花正在路上，記得把笑容準備好。','結婚？先交往，先約會，先把頭髮梳好再說！']],
[/錢|財|賺|薪水|股票|樂透|彩券|買/,['錢啊？我是鏡子，只認得你的臉，不認得你的錢包，不過勸你少買點零食。','財運嘛，努力工作最穩，樂透嘛，買了再說，哈哈哈！','賺錢的秘訣：少睡一點、多笑一點，客人才多一點。','省下來的錢才是賺到的，今天先別亂刷卡。','這問題我只能說：投資自己，穩賺不賠。']],
[/吃|餓|飯|餐|喝|宵夜|減肥|胖|瘦/,['肚子餓的人沒有煩惱，快去吃東西，吃完再來問我。','減肥明天再開始，今天先吃開心，哈哈哈！','來杯熱飲吧，溫暖的胃，溫暖的心。','我建議你吃個你最愛的，因為你值得。','胖不胖我不知道，我只知道你笑起來很好看。']],
[/工作|上班|老闆|考試|讀書|成績|學校|作業/,['工作再累也要記得喝水，老闆不會幫你喝。','考試？先睡飽再說，睡不飽的腦袋會說謊。','努力的人運氣不會太差，你已經走在對的路上。','老闆很煩，但你比他可愛，放心。','慢慢來，比較快，休息一下再衝！']],
[/天氣|下雨|太熱|很冷|太陽|颱風/,['天氣？抬頭看看就知道，不過出門還是帶把傘吧，小心為上。','冷了就加衣，熱了就喝水，鏡子只能保證你很好看。','下雨天最適合窩在家，順便照照鏡子，哈哈哈！','我雖然是鏡子，但我看見了：今天適合穿好看一點出門。']],
[/你是誰|你叫什麼|你是|你會|你喜歡|你幾歲/,['我是魔鏡，一面見過無數美人的鏡子，也被無數美人吐槽過。','我是全世界最有個性的鏡子，沒有之一。','我？我是專門幫你找命中注定的人的魔鏡！','我喜歡被擦得亮亮的，還有被你誇獎，哈哈哈！']],
[/謝謝|感謝|讚|好棒/,['哈哈，客氣什麼，小親親，記得有空來照照我就是最好的謝禮。','能幫上你，我的鏡面都閃閃發亮了！','不客氣，下次帶朵玫瑰來我就更開心了。']],
[/笑話|好笑|無聊|講個/,['有一天鏡子對你說：「我說句實話喔」，你說：「好」，鏡子說：「你該洗臉了。」哈哈哈！','為什麼鏡子很會講笑話？因為它每天都在反思！哈哈哈！','無聊嗎？那就去按愛心，我幫你配個超級有趣的對象！']]];
const lastPick={};
function pickOne(a,k){let i=Math.floor(Math.random()*a.length);if(a.length>1&&i===lastPick[k])i=(i+1+Math.floor(Math.random()*(a.length-1)))%a.length;lastPick[k]=i;return a[i]}
function fallback(q){if(PRE[q])return pickOne(PRE[q],q);for(let n=0;n<KW.length;n++)if(KW[n][0].test(q))return pickOne(KW[n][1],'k'+n);return pickOne(CANNED,'g')}
let rid=0,lastT='',ctl=null;const cjk=t=>(t.match(/[\u4e00-\u9fff]/g)||[]).length/Math.max(t.length,1);
function liveSay(t){const e=$('say').querySelector('.sm');if(e)e.textContent=t}
async function send(q0){const q=(typeof q0==='string'?q0:$('inp').value).trim();if(!q)return;if($('inp'))$('inp').value='';const id=++rid;if(ctl)ctl.abort();ctl=new AbortController();const my=ctl;busy=true;sfx('tap');$('say').style.whiteSpace='pre-line';say('你問：'+q+'\n（魔鏡思考中…）','c',false);
 if(PRE[q]){await sleep(700);if(id!==rid)return;busy=false;$('glass').classList.add('q');say(pickOne(PRE[q],q),'c',true);return}
 let t=null,fail='',fb=0;
 try{await sampleReady;if(!sample)throw {code:'none'};
  const r=await sample(PERSONA+'每次回答不超過50字，並且要直接針對玩家的問題回答。\n\n玩家問：'+q,{cache:false,modelTier:'quick',signal:my.signal,onText:({text})=>{if(id===rid)liveSay(text)}});
  t=(r&&r.text)||'…'}catch(e){fail=(e&&e.code)||'x';if(fail==='cancelled')return}
 if(id!==rid)return;
 if(t==null)t=fail==='rate_limited'?'魔鏡的法力暫時用完了，等一下再來問我吧。':(fb=1,fallback(q));
 busy=false;$('glass').classList.add('q');const zh=fb||cjk(t)>.3;say(t,'c',zh);if(!zh){lastT=t;$('tr').classList.remove('hide')}}

/* ---------- download card ---------- */
async function download(){
 const W=600,c=document.createElement('canvas'),x=c.getContext('2d'),F='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif',B='20px '+F;
 const wrap=t=>{x.font=B;const o=[];let l='';for(const ch of t){if(x.measureText(l+ch).width>470){o.push(l);l=ch}else l+=ch}if(l)o.push(l);return o};
 const fit=(t,px,wt)=>{let n=px;x.font=wt+' '+n+'px '+F;while(x.measureText(t).width>470&&n>12){n--;x.font=wt+' '+n+'px '+F}return wt+' '+n+'px '+F};
 const tags=RACES[sel.race]+'・'+sel.target+'・'+sel.vibe+'型',m='配對度 '+Math.round(res.match)+'%';
 const fN=fit(res.name,40,'bold'),fT=fit(tags,22,''),fM=fit(m,26,'bold');
 const G=[wrap(res.title),wrap(res.bio),wrap('「'+res.pickup+'」')];
 const Hh=722+G.reduce((a,g)=>a+g.length*28+12,0)+60;
 c.width=W;c.height=Hh;
 const g=x.createLinearGradient(0,0,0,Hh);g.addColorStop(0,'#2a1245');g.addColorStop(1,'#140a24');x.fillStyle=g;x.fillRect(0,0,W,Hh);x.strokeStyle='#f6c945';x.lineWidth=8;x.strokeRect(14,14,W-28,Hh-28);
 const img=new Image();await new Promise(r=>{img.onload=r;img.onerror=r;img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(portrait(sel,true))});
 x.save();x.beginPath();x.ellipse(300,300,190,250,0,0,7);x.clip();x.fillStyle='#3a2470';x.fillRect(0,0,W,Hh);x.drawImage(img,100,30,400,540);x.restore();
 x.strokeStyle='#f6c945';x.lineWidth=10;x.beginPath();x.ellipse(300,300,190,250,0,0,7);x.stroke();
 x.textAlign='center';x.fillStyle='#f6c945';x.font=fN;x.fillText(res.name,300,616);
 x.fillStyle='#ff9dc2';x.font=fT;x.fillText(tags,300,650);
 x.fillStyle='#fff';x.font=fM;x.fillText(m,300,690);
 x.fillStyle='#e8dcf7';x.font=B;let y=730;
 G.forEach(g=>{g.forEach(l=>{x.fillText(l,300,y);y+=28});y+=12});
 x.fillStyle='#b9a6d3';x.font='16px '+F;x.fillText('— 魔鏡啊魔鏡 認證・僅供搞笑 —',300,Hh-32);
 const blob=await new Promise(r=>c.toBlob(r,'image/png'));
 try{const d=await window.claude?.use('downloads');if(!d)throw 0;await d.save({filename:'magic-mirror-card.png',data:blob})}
 catch(e){if(e&&e.code==='declined')return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='magic-mirror-card.png';a.click();}}

/* ---------- init ---------- */
function pauseAll(){paused=true;try{AC&&AC.suspend();speechSynthesis.cancel()}catch(e){}talk(false)}
function resumeAll(){if(document.hidden)return;paused=false;try{AC&&soundOn&&AC.resume()}catch(e){}}
document.addEventListener('visibilitychange',()=>document.hidden?pauseAll():resumeAll());
addEventListener('pagehide',pauseAll);addEventListener('pageshow',resumeAll);
try{new IntersectionObserver(e=>e[0].isIntersecting?resumeAll():pauseAll()).observe(document.body)}catch(e){}
$('tr').onclick=async()=>{const t=lastT,b=$('tr');b.disabled=true;b.textContent='翻譯中…';let z,ok=1;
 try{await sampleReady;if(!sample)throw 0;const r=await sample('請把以下內容翻譯成繁體中文，只輸出翻譯結果：\n\n'+t,{cache:false,modelTier:'quick'});z=r.text||'…'}catch(e){ok=0;z=t}
 b.disabled=false;b.textContent='🌐 翻譯成中文';say(ok?z:t,'c',!!ok);if(!ok){lastT=t;b.classList.remove('hide');b.textContent='🌐 翻譯失敗，再試一次'}};
$('bq').onclick=quest;$('bc').onclick=chat;
$('bm').onclick=()=>{soundOn=!soundOn;$('bm').textContent=soundOn?'🔊':'🔇';if(!soundOn){try{speechSynthesis.cancel()}catch(e){}}};
initAudio();try{AC&&AC.resume()}catch(e){}
const wake=()=>{try{initAudio();AC&&AC.state!=='running'&&!document.hidden&&AC.resume()}catch(e){}};
['pointerdown','touchstart','touchend','click','keydown'].forEach(ev=>addEventListener(ev,wake,{passive:true}));
$('start').onclick=()=>{$('start').classList.add('hide');initAudio();try{speechSynthesis.getVoices()}catch(e){}home()};
